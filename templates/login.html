<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - AutoRen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="login-body">
<div class="top-bar-login">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Logo_Nuevo_Ufro.png/1043px-Logo_Nuevo_Ufro.png"
         height="70" alt="Logo UFRO">
    <img src="https://bioren.ufro.cl/wp-content/uploads/2022/04/logo-BIOREN-UFRO-02.png" height="70"
         alt="Logo BIOREN-UFRO">
</div>

<div class="login-container">
    <div class="login-box">
        <h2>Ingreso a AutoRen</h2>
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label for="email">Correo electrónico</label>
            <input type="text" name="email" id="email" required>

            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
